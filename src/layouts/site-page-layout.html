<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<meta
			name="description"
			content="{{ description }}"
		/>
		<meta
			name="theme-color"
			content="#7C3A12"
		/>
		<title>Sabor y Tradición - {{ title }}</title>
		<link
			rel="icon"
			href="/src/images/favicon.ico"
		/>

		<!-- Common CSS: cargar de forma bloqueante -->
		<link
			rel="stylesheet"
			href="/src/styles/common.scss"
		/>

		<!-- Page-specific CSS: cada página inyectará sus propios estilos -->
		<block name="page-styles"></block>

		<!-- Preconnect para fuentes: establecer conexión temprana -->
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com"
		/>
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>

		<!-- Fuentes optimizadas: solo variantes necesarias + font-display swap -->
		<link
			href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Source+Sans+3:wght@400;600&display=swap"
			rel="stylesheet"
			media="print"
			onload="this.media = 'all'"
		/>
		<noscript>
			<link
				href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Source+Sans+3:wght@400;600&display=swap"
				rel="stylesheet"
			/>
		</noscript>
	</head>
	<body>
		<include src="partials/header.html"></include>

		<main id="main-content">
			<block name="content"></block>
		</main>

		<include src="partials/footer.html"></include>
		<script
			type="module"
			src="/src/ts/main.ts"
		></script>
	</body>
</html>
