<div class="recipe-card">
	<a
		href="{{ recipe.link }}"
		class="recipe-card__link"
		aria-label="{{ recipe.link_aria_label }}"
	>
		<!-- Imagen de la receta -->
		<div class="recipe-card__image-wrapper">
			<picture>
				<!-- WebP con diferentes tamaños (resolution switching) -->
				<source
					type="image/webp"
					srcset="
						../images/{{ recipe.image }}?as=webp&width=240 240w,
						../images/{{ recipe.image }}?as=webp&width=320 320w,
						../images/{{ recipe.image }}?as=webp&width=480 480w,
						../images/{{ recipe.image }}?as=webp&width=640 640w,
						../images/{{ recipe.image }}?as=webp&width=720 720w
					"
					sizes="
						(max-width: 767px) calc(100vw - 2rem),
						(max-width: 1023px) calc(50vw - 1.5rem),
						(min-width: 1024px) calc((1200px - 4rem) / 3)
					"
				/>
				<!-- Fallback con diferentes tamaños -->
				<img
					src="../images/{{ recipe.image }}?width=320"
					srcset="
						../images/{{ recipe.image }}?width=240 240w,
						../images/{{ recipe.image }}?width=320 320w,
						../images/{{ recipe.image }}?width=480 480w,
						../images/{{ recipe.image }}?width=640 640w,
						../images/{{ recipe.image }}?width=720 720w
					"
					sizes="
							(max-width: 767px) calc(100vw - 2rem),
							(max-width: 1023px) calc(50vw - 1.5rem),
							(min-width: 1024px) calc((1200px - 4rem) / 3)
					"
					alt="{{ recipe.alt_image }}"
					class="recipe-card__image"
					width="400"
					height="300"
					loading="lazy"
				/>
			</picture>

			<!-- Categoría de la receta -->
			<span class="recipe-card__category">
				<span class="sr-only">Categoría: </span>
				{{ recipe.category }}
			</span>
		</div>

		<!-- Contenido de la receta -->
		<div class="recipe-card__content">
			<h3 class="recipe-card__title">{{{ recipe.title_html }}}</h3>
			<p class="recipe-card__description">{{{ recipe.description_html }}}</p>
			<div class="recipe-card__meta">
				<div class="recipe-card__meta-item">
					<svg
						class="icon icon--primary"
						aria-hidden="true"
					>
						<use href="#fa-clock"></use>
					</svg>
					<span class="sr-only">Duración: </span>
					{{ recipe.duration }}
				</div>
				<div class="recipe-card__meta-item">
					<svg
						class="icon icon--primary"
						aria-hidden="true"
					>
						<use href="#fa-star"></use>
					</svg>
					<span class="sr-only">Dificultad: </span>
					{{ recipe.difficulty }}
				</div>
			</div>
		</div>
	</a>
</div>
