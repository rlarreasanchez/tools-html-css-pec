<article
	class="detail"
	aria-labelledby="detail-title"
>
	<!-- Imagen principal -->
	<div
		class="detail__hero"
		data-aos="fade-down"
	>
		<picture>
			<!-- Móvil -->
			<source
				media="(max-width: 767px)"
				type="image/webp"
				srcset="
					../images/{{ image }}?as=webp&width=480&height=600&fit=cover 480w,
					../images/{{ image }}?as=webp&width=640&height=800&fit=cover 640w,
					../images/{{ image }}?as=webp&width=960&height=1200&fit=cover 960w,
					../images/{{ image }}?as=webp&width=1280&height=1600&fit=cover 1280w
				"
				sizes="100vw"
			/>
			<source
				media="(max-width: 767px)"
				srcset="
					../images/{{ image }}?width=480&height=600&fit=cover 480w,
					../images/{{ image }}?width=640&height=800&fit=cover 640w,
					../images/{{ image }}?width=960&height=1200&fit=cover 960w,
					../images/{{ image }}?width=1280&height=1600&fit=cover 1280w
				"
				sizes="100vw"
			/>
			<!-- Tablet -->
			<source
				media="(min-width: 768px) and (max-width: 1023px)"
				type="image/webp"
				srcset="
					../images/{{ image }}?as=webp&width=768&height=480&fit=cover 768w,
					../images/{{ image }}?as=webp&width=1024&height=640&fit=cover 1024w,
					../images/{{ image }}?as=webp&width=1366&height=854&fit=cover 1366w,
					../images/{{ image }}?as=webp&width=1600&height=1000&fit=cover 1600w
				"
				sizes="100vw"
			/>
			<source
				media="(min-width: 768px) and (max-width: 1023px)"
				srcset="
					../images/{{ image }}?width=768&height=480&fit=cover 768w,
					../images/{{ image }}?width=1024&height=640&fit=cover 1024w,
					../images/{{ image }}?width=1366&height=854&fit=cover 1366w,
					../images/{{ image }}?width=1600&height=1000&fit=cover 1600w
				"
				sizes="100vw"
			/>
			<!-- Desktop -->
			<source
				media="(min-width: 1024px)"
				type="image/webp"
				srcset="
					../images/{{ image }}?as=webp&width=1024&height=512&fit=cover 1024w,
					../images/{{ image }}?as=webp&width=1280&height=640&fit=cover 1280w,
					../images/{{ image }}?as=webp&width=1600&height=800&fit=cover 1600w,
					../images/{{ image }}?as=webp&width=1920&height=960&fit=cover 1920w
				"
				sizes="100vw"
			/>
			<source
				media="(min-width: 1024px)"
				srcset="
					../images/{{ image }}?width=1024&height=512&fit=cover 1024w,
					../images/{{ image }}?width=1280&height=640&fit=cover 1280w,
					../images/{{ image }}?width=1600&height=800&fit=cover 1600w,
					../images/{{ image }}?width=1920&height=960&fit=cover 1920w
				"
				sizes="100vw"
			/>
			<!-- Fallback -->
			<img
				class="detail__hero-image"
				src="../images/{{ image }}?width=1024&height=512&fit=cover"
				srcset="
					../images/{{ image }}?width=480&height=600&fit=cover 480w,
					../images/{{ image }}?width=640&height=800&fit=cover 640w,
					../images/{{ image }}?width=768&height=480&fit=cover 768w,
					../images/{{ image }}?width=1024&height=512&fit=cover 1024w,
					../images/{{ image }}?width=1280&height=640&fit=cover 1280w,
					../images/{{ image }}?width=1600&height=800&fit=cover 1600w,
					../images/{{ image }}?width=1920&height=960&fit=cover 1920w
				"
				sizes="100vw"
				alt="{{ alt_image }}"
				width="1200"
				height="600"
				loading="eager"
				fetchpriority="high"
			/>
		</picture>
	</div>

	<div class="detail__container">
		<!-- Header / Breadcrumbs -->
		<include
			src="partials/breadcrumb.html"
			locals='{ "breadcrumb": breadcrumb }'
		></include>
		<header
			class="detail__header"
			data-aos="fade-up"
			data-aos-delay="100"
		>
			<span class="section-label">{{ category }}</span>
			<h1
				id="detail-title"
				class="detail__title"
			>
				{{{ title_html }}}
			</h1>
			<dl class="detail__meta">
				<div class="detail__meta-item">
					<dt>
						<i
							class="far fa-clock icon-space-right"
							aria-hidden="true"
						></i>
						Tiempo de preparación
					</dt>
					<dd>{{ duration }}</dd>
				</div>
				<div class="detail__meta-item">
					<dt>
						<i
							class="far fa-star icon-space-right"
							aria-hidden="true"
						></i>
						Dificultad
					</dt>
					<dd>{{ difficulty }}</dd>
				</div>
				<div class="detail__meta-item">
					<dt>
						<i
							class="fas fa-users icon-space-right"
							aria-hidden="true"
						></i>
						Raciones
					</dt>
					<dd>{{ rations }} personas</dd>
				</div>
			</dl>
		</header>

		<div class="detail__body">
			<!-- Contenido de la receta -->
			<each loop="content in contents">
				<!-- Párrafo -->
				<if condition="content.type === 'paragraph'">
					<p>{{{ content.text }}}</p>
				</if>

				<!-- Imagen -->
				<if condition="content.type === 'image'">
					<figure
						class="detail__figure"
						data-aos="fade-up"
						data-aos-delay="200"
					>
						<picture>
							<!-- WebP adaptado al ancho real del artículo -->
							<source
								type="image/webp"
								srcset="
									../images/{{ content.src }}?as=webp&width=480 480w,
									../images/{{ content.src }}?as=webp&width=800 800w,
									../images/{{ content.src }}?as=webp&width=1200 1200w,
									../images/{{ content.src }}?as=webp&width=1600 1600w
								"
								sizes="(max-width: 832px) calc(100vw - 2rem), 800px"
							/>
							<!-- Fallback con tamaños equivalentes -->
							<img
								class="detail__image"
								src="../images/{{ content.src }}?width=800"
								srcset="
									../images/{{ content.src }}?width=480 480w,
									../images/{{ content.src }}?width=800 800w,
									../images/{{ content.src }}?width=1200 1200w,
									../images/{{ content.src }}?width=1600 1600w
								"
								sizes="(max-width: 832px) calc(100vw - 2rem), 800px"
								alt="{{ content.alt }}"
								width="800"
								height="500"
								loading="lazy"
							/>
						</picture>
						<figcaption class="detail__caption">{{{ content.caption }}}</figcaption>
					</figure>
				</if>

				<!-- Video -->
				<if condition="content.type === 'video'">
					<figure
						class="detail__video"
						data-aos="zoom-in"
						data-aos-delay="100"
					>
						<h2 class="detail__video-title">Video: {{ content.title }}</h2>
						<div class="detail__video-wrapper">
							<iframe
								width="560"
								height="315"
								src="{{ content.src }}"
								title="Video tutorial: {{ content.title }}"
								loading="lazy"
								allow="
									accelerometer;
									autoplay;
									clipboard-write;
									encrypted-media;
									gyroscope;
									picture-in-picture;
									web-share;
								"
								referrerpolicy="strict-origin-when-cross-origin"
								allowfullscreen
							></iframe>
						</div>
						<figcaption class="detail__caption">{{{ content.caption }}}</figcaption>
					</figure>
				</if>
			</each>

			<!-- Paginación -->
			<nav
				class="detail__pagination"
				aria-label="Navegacion entre recetas"
			>
				<if condition="prevLink">
					<a
						href="{{ prevLink }}"
						class="detail__pagination-link detail__pagination-link--prev"
						data-aos="fade-right"
						data-aos-delay="100"
					>
						<i
							class="fas fa-chevron-left icon-chevron-left"
							aria-hidden="true"
						></i>
						<span class="detail__pagination-label">Receta anterior</span>
						<span class="detail__pagination-title">{{ prevLinkTitle }}</span>
					</a>
				</if>
				<else>
					<a
						href="/categoria"
						class="detail__pagination-link detail__pagination-link--prev"
						data-aos="fade-right"
						data-aos-delay="100"
					>
						<i
							class="fas fa-chevron-left icon-chevron-left"
							aria-hidden="true"
						></i>
						<span class="detail__pagination-label">Volver a</span>
						<span class="detail__pagination-title">Todas las recetas</span>
					</a>
				</else>
				<if condition="nextLink">
					<a
						href="{{ nextLink }}"
						class="detail__pagination-link detail__pagination-link--next"
						data-aos="fade-left"
						data-aos-delay="100"
					>
						<span class="detail__pagination-label">Siguiente receta</span>
						<span class="detail__pagination-title">{{ nextLinkTitle }}</span>
						<i
							class="fas fa-chevron-right icon-chevron-right"
							aria-hidden="true"
						></i>
					</a>
				</if>
				<else>
					<a
						href="/categoria"
						class="detail__pagination-link detail__pagination-link--next"
						data-aos="fade-left"
						data-aos-delay="100"
					>
						<span class="detail__pagination-label">Volver a</span>
						<span class="detail__pagination-title">Todas las recetas</span>
						<i
							class="fas fa-chevron-right icon-chevron-right"
							aria-hidden="true"
						></i>
					</a>
				</else>
			</nav>
		</div>
	</div>
</article>
